_BASE_: "../fastreid/configs/Base-bagtricks.yml"

DATASETS:
  NAMES: ("VeRi",)
  TESTS: ("VeRi",)

MODEL:
  HEADS:
    NUM_CLASSES: 576
    POOL_LAYER: GlobalAvgPool
    CLS_LAYER: Linear
    NECK_FEAT: before
  BACKBONE:
    DEPTH: "50x"
    FEAT_DIM: 2048
    WITH_IBN: True
    WITH_NL: False
    # --- 关键修改：禁止自动下载预训练权重 ---
    LAST_STRIDE: 1
    PRETRAIN: True
    # ----------------------------------
  DEVICE: "cuda"

INPUT:
  SIZE_TRAIN: [256, 256]
  SIZE_TEST: [256, 256]
  REA:
    ENABLED: True
  CJ:
    ENABLED: True

DATALOADER:
  SAMPLER_TRAIN: NaiveIdentitySampler
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  AMP:
    ENABLED: False
  OPT: Adam
  BASE_LR: 0.00035
  IMS_PER_BATCH: 64
  MAX_EPOCH: 60
  STEPS: [30, 50]
  WARMUP_ITERS: 1000
  CHECKPOINT_PERIOD: 10
  FREEZE_ITERS: 0
  CLIP_GRADIENTS:
    ENABLED: False

TEST:
  EVAL_PERIOD: 5
  IMS_PER_BATCH: 128
  METRIC: cosine

OUTPUT_DIR: "outputs/veri_baseline"
